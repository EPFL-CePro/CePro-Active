# Reusable workflow: deploy an "ops" repository (Ansible configuration with secrets in keybase).
# Lives in a central repo, e.g. EPFL-CePro/CePro-Active, and is called with :
#   uses: EPFL-CePro/CePro-Active/.github/workflows/ansible-deploy.yml@main
name: CEPro Ansible deploy

on:
  workflow_call:
    inputs:
      playbook:
        description: Path to the playbook in the ops repo
        type: string
        default: playbook.yml
      inventory:
        description: Path to the inventory in the ops repo
        type: string
        default: inventory/prod.yml
      requirements:
        description: Galaxy requirements file (roles and/or collections); skipped if absent
        type: string
        default: requirements.yml
      workflows_ref:
        description: Ref of EPFL-CePro/CePro-Active to take the toolchain from (keep in sync with the @ref in "uses:")
        type: string
        default: main
      keybase_dir:
        description: Keybase directory holding the secrets (e.g. /keybase/team/ceproject)
        type: string
        required: true
      tags:
        description: Comma-separated Ansible tags to run (empty = whole playbook)
        type: string
        default: ""
      extra_vars:
        description: Space-separated key=value pairs passed as -e to Ansible
        type: string
        default: ""
      check_mode:
        description: Dry run (ansible-playbook --check), changes nothing on the host
        type: boolean
        default: false
      environment:
        description: GitHub environment (protection rules + environment secrets)
        type: string
        default: production
      runs_on:
        description: Runner labels as JSON (must be able to reach the target VM over SSH)
        type: string
        default: '["self-hosted", "linux"]'
    secrets:
      SSH_PRIVATE_KEY:
        required: true
      SSH_KNOWN_HOSTS:
        required: true
      KEYBASE_USERNAME:
        required: true
      KEYBASE_PAPERKEY:
        required: true

jobs:
  deploy:
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    environment: ${{ inputs.environment }}
    concurrency:
      # Never run two deployments of the same ops repo at once; queue them.
      group: ansible-deploy-${{ github.repository }}
      cancel-in-progress: false
    env:
      # Galaxy installs go in the workspace (wiped by the next checkout) instead of
      # ~/.ansible, which persists between jobs on a self-hosted runner
      ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/.ansible/collections
      ANSIBLE_ROLES_PATH: ${{ github.workspace }}/.ansible/roles

    steps:
      - name: Check out the Ansible config (the calling repo)
        uses: actions/checkout@v7

      - name: Check out the shared toolchain (ansible-deploy/pyproject.toml + uv.lock)
        uses: actions/checkout@v7
        with:
          repository: EPFL-CePro/CePro-Active
          ref: ${{ inputs.workflows_ref }}
          path: .cepro-toolchain
          sparse-checkout: ansible-deploy

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: .cepro-toolchain/ansible-deploy/uv.lock

      - name: Install Ansible from the lockfile
        run: |
          uv sync --project .cepro-toolchain/ansible-deploy --locked
          echo "$GITHUB_WORKSPACE/.cepro-toolchain/ansible-deploy/.venv/bin" >> "$GITHUB_PATH"

      - name: Install Galaxy requirements
        # hashFiles() returns '' when no file matches, so the step shows as skipped
        if: hashFiles(inputs.requirements) != ''
        env:
          REQUIREMENTS: ${{ inputs.requirements }}
        run: ansible-galaxy install -r "$REQUIREMENTS"

      - name: Install Keybase (if missing)
        run: |
          if ! command -v keybase >/dev/null; then
            curl -fsSLo "$RUNNER_TEMP/keybase.deb" https://prerelease.keybase.io/keybase_amd64.deb
            sudo apt-get install -y "$RUNNER_TEMP/keybase.deb"
          fi

      - name: Fetch secrets from Keybase
        env:
          KEYBASE_USERNAME: ${{ secrets.KEYBASE_USERNAME }}
          KEYBASE_PAPERKEY: ${{ secrets.KEYBASE_PAPERKEY }}
          KEYBASE_DIR: ${{ inputs.keybase_dir }}
        run: |
          # Start the Keybase daemon in the background
          (keybase service >/dev/null 2>&1 &)
          # Wait until the daemon answers (up to 30 s)
          for _ in $(seq 30); do keybase status >/dev/null 2>&1 && break; sleep 1; done
          # Log in as the bot with KEYBASE_USERNAME / KEYBASE_PAPERKEY; nothing is saved on disk
          keybase oneshot
          rm -rf "$RUNNER_TEMP/secrets"
          keybase fs cp -r "$KEYBASE_DIR" "$RUNNER_TEMP/secrets"
          chmod -R go-rwx "$RUNNER_TEMP/secrets"
          # List file names only (never contents) to check the layout: expect .env, certs... directly here
          ls -A "$RUNNER_TEMP/secrets"

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/id_ansible"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"

      - name: Run the playbook
        env:
          PLAYBOOK: ${{ inputs.playbook }}
          INVENTORY: ${{ inputs.inventory }}
          TAGS: ${{ inputs.tags }}
          EXTRA_VARS: ${{ inputs.extra_vars }}
          CHECK_MODE: ${{ inputs.check_mode }}
          ANSIBLE_FORCE_COLOR: "1"
        run: |
          export ANSIBLE_PRIVATE_KEY_FILE="$RUNNER_TEMP/id_ansible"
          export ANSIBLE_SSH_ARGS="-C -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts -o StrictHostKeyChecking=yes"
          args=(-i "$INVENTORY" -e "secrets_dir=$RUNNER_TEMP/secrets")
          if [ -n "$TAGS" ]; then args+=(-t "$TAGS"); fi
          for v in $EXTRA_VARS; do args+=(-e "$v"); done
          # Never add --diff: it would print the content of copied secret files in the log
          if [ "$CHECK_MODE" = "true" ]; then args+=(--check); fi
          ansible-playbook "${args[@]}" "$PLAYBOOK"

      - name: Clean up secrets
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/secrets" "$RUNNER_TEMP/id_ansible" "$RUNNER_TEMP/known_hosts"
          keybase logout --force >/dev/null 2>&1 || true